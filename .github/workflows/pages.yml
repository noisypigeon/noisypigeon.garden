# Lives here, not in library: deploy-pages only deploys the calling repo's site.
# Named pages.yml, the one name runway's sites.yml dispatches in a shim
# (LIB-0034 §4). Until LIB-0035's cutover finishes it still builds this repo's
# own web/; then it becomes a call to the library's site-pages.yml.
name: Deploy noisypigeon.garden

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: noisypigeon/library/.github/workflows/zola-site-pages.yml@workflows/v4.13.0
    with:
      src_dir: web
      build_cmd: "zola build"
      fetch_script: fetch-lib.sh
      theme_script: .lib-src/zola-site/resolve-theme.sh
      terraform_docs: true
      extra_step: ".lib-src/.github/scripts/generate-module-redirects.sh --content-root web/content --static-root web/static"
